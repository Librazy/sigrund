[workspace]
members = ["crates/sigrund-core", "crates/sigrund"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
base64 = "0.22"
ed25519-dalek = "2"
libc = "0.2"
hmac = "0.12"
getrandom = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
ssh-key = { version = "0.7.0-rc.11", default-features = true, features = ["ed25519"] }
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v7", "serde"] }
