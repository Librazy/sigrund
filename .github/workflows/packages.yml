name: Packages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  should-run:
    permissions:
      pull-requests: read
    uses: ./.github/workflows/should-run.yml

  packages:
    name: Build and smoke tests
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    uses: ./.github/workflows/packages-jobs.yml
