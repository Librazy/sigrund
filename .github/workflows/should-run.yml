name: Select workflow runs

on:
  workflow_call:
    outputs:
      run:
        description: Whether the caller should run its checks.
        value: ${{ jobs.select.outputs.run }}

permissions:
  pull-requests: read

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - name: Skip branch pushes already covered by an open pull request
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/* ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch=${GITHUB_REF#refs/heads/}
          pages=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            --field state=open --field "head=$GITHUB_REPOSITORY_OWNER:$branch" \
            --field per_page=100 --paginate --slurp)
          has_pr=$(jq --arg repository "$GITHUB_REPOSITORY" --arg branch "$branch" \
            'any(.[][]; .head.repo.full_name == $repository and .head.ref == $branch)' <<< "$pages")
          if [[ "$has_pr" == true ]]; then
            echo 'An open pull request covers this branch; skipping push checks.'
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
