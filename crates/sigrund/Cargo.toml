[package]
name = "sigrund"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hmac.workspace = true
libc.workspace = true
serde_json.workspace = true
sha2.workspace = true
ssh-key.workspace = true
